<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in – AssignHub</title><link rel="stylesheet" href="style.css"></head><body>
<div class="center"><div class="card login"><h2>Log in</h2><p class="mute">Use your college email to continue.</p>
<form id="f" novalidate><label for="e">Email</label><input id="e" type="text" placeholder="you@college.edu" autocomplete="username">
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
<p id="err" class="mute" style="color:red;font-weight:600" role="alert"></p>
<p id="status" class="mute"></p>
<button type="submit" id="go" class="btn" style="width:100%;margin-top:.6rem">Log in</button></form>
<div class="hint"><b>Demo accounts</b> (password: demo123)<br>Student: aarav@college.edu<br>Student: priya@college.edu<br>Teacher: meera@college.edu</div>
<p class="mute" style="text-align:center"><a href="index.html">Back to home</a></p></div></div>
<script src="data.js"></script><script src="auth.js"></script>
<script>
var err=document.getElementById('err'), st=document.getElementById('status');
st.textContent = (typeof Auth!=='undefined' && typeof DB!=='undefined') ? 'Scripts loaded OK.' : 'PROBLEM: data.js or auth.js did not load.';
function doLogin(e){
  if(e) e.preventDefault();
  err.textContent='';
  try{
    var u=Auth.login(document.getElementById('e').value,document.getElementById('p').value);
    if(!u){err.textContent='Email or password is incorrect.';return;}
    err.style.color='green'; err.textContent='Login successful. Opening dashboard...';
    window.location.href='app.html#/dashboard';
  }catch(ex){
    err.textContent='Error: '+ex.name+' - '+ex.message;
  }
}
document.getElementById('f').addEventListener('submit',doLogin);
document.getElementById('go').addEventListener('click',doLogin);
</script></body></html>
